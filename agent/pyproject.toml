[project]
name = "lz-agent"
version = "0.1.0"
description = "HuaweiCloud Landing Zone agentic orchestration tool"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openpyxl>=3.1.0",
    "jsonschema>=4.23.0",
    "boto3>=1.34.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "google-cloud-pubsub>=2.21.0",
    "google-auth>=2.30.0",
    "google-api-python-client>=2.130.0",
    "jinja2>=3.1.4",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "structlog>=24.2.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "anyio>=4.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: mark test as integration (requires real cloud account)"]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]
