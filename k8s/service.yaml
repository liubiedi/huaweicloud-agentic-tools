apiVersion: v1
kind: Service
metadata:
  name: lz-agent
  namespace: lz-agent
  annotations:
    # Huawei CCE ELB provisioning — creates a public ELB with EIP
    kubernetes.io/elb.class: union
    kubernetes.io/elb.autocreate: |
      {
        "type": "public",
        "bandwidth_name": "lz-agent-bandwidth",
        "bandwidth_chargemode": "traffic",
        "bandwidth_size": 5,
        "bandwidth_sharetype": "PER",
        "eip_type": "5_bgp"
      }
spec:
  type: LoadBalancer
  selector:
    app: lz-agent
  ports:
    - name: webhook
      protocol: TCP
      port: 80
      targetPort: 8080
